# Configuration nginx : Basic Auth + HTTPS devant l'application.
# L'application Python ecoute sur 127.0.0.1:8000 et n'est jamais exposee.
#
# APRES avoir obtenu un certificat (certbot ou auto-signe), certbot peut
# modifier ce fichier automatiquement ; sinon utilisez le modele ci-dessous.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # tout le trafic passe en HTTPS (certificat requis, voir install.sh)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    # --- certificats (remplacez par les chemins certbot si domaine) ---
    ssl_certificate     /etc/nginx/ssl/compte_bancaire.crt;
    ssl_certificate_key /etc/nginx/ssl/compte_bancaire.key;

    # --- authentification : rempli par install.sh (htpasswd) ---
    auth_basic "Compte bancaire - acces prive";
    auth_basic_user_file /etc/nginx/.htpasswd_compte;

    # defense en profondeur : l'arret via navigateur est aussi refuse
    # par l'application elle-meme, on le bloque une seconde fois ici
    location = /api/arret {
        return 403;
    }

    # corps plus large pour l'import/export
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
